steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/cloud-monitored-rag", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/cloud-monitored-rag"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cloud-monitored-rag
      - --image=gcr.io/$PROJECT_ID/cloud-monitored-rag
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --min-instances=0
      - --max-instances=3
substitutions:
  _REGION: us-central1
images:
  - gcr.io/$PROJECT_ID/cloud-monitored-rag
